name: Deploy to Azure Web App

on:
  push:
    branches: [main]

env:
  AZURE_WEBAPP_NAME: 'ganttguru-winningproposal'   # set this to your Azure Web App name
  NODE_VERSION: '20'
  APP_DIR: WinningProposal   # app folder (package.json, server.js, frontend/) – use . if repo root has them

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.APP_DIR }}
